[package]
name = "ruvel-app"
version = "0.7.0"  # x-release-please-version
edition = "2024"

[[bin]]
name = "app"
path = "main.rs"

[dependencies]
ruvel = "0.7.1"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[lints.clippy]
async_fn_in_trait = "allow"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false
