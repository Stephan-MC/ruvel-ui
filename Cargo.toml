[package]
name = "ruvel"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "app"
path = "main.rs"

[dependencies]
mimalloc = "0.1.52"
ruvel = "0.3.0"
tokio = { version = "1.54.1", features = ["full"] }

[lints.clippy]
async_fn_in_trait = "allow"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false
