[package]
name = "ruvel_ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ruvel_ui"
path = "main.rs"

[dependencies]
async-trait = "0.1.92"
ruvel = "0.*"
tokio = { version = "1.54.1", features = ["full"] }

[lints.clippy]
async_fn_in_trait = "allow"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = false
